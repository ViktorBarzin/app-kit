name: CI

# Committed on the FORGEJO side (viktor/app-kit); this GitHub repo is a
# one-way push mirror. Runs on every mirrored branch.
on:
  push:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # The DB, LISTEN and HTTP tests run when TEST_DATABASE_URL is set; each
      # test makes and drops its own database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx biome check
      # Packages: tsc -b builds dist/ (the template imports the built output).
      - run: bunx tsc -b
      - run: bun run build
      - run: bunx tsc -p tsconfig.check.json
      - run: bun run test
      - name: Install gitleaks (pinned)
        run: |
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz
      - run: bun scripts/check-public.ts --require-gitleaks
      # The template, against the packages as they are in this commit.
      - run: bun run build
        working-directory: template
      - run: bun run typecheck
        working-directory: template
      - run: bun run test
        working-directory: template
      - run: bunx playwright install --with-deps chromium
        working-directory: template
      - run: bun run test:e2e
        working-directory: template
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: template/test-results/
          retention-days: 7
