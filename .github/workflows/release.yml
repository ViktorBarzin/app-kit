name: Release

# Publishes every @viktorbarzin package whose version is not on npm yet, with
# npm trusted publishing (OIDC, provenance, no NPM_TOKEN), then tags
# `<name>@<version>` on Forgejo. Versions are bumped in package.json on
# Forgejo master (changesets locally); there are no version PRs here because
# this repo is a one-way mirror.
#
# Publishing runs only when the repo variable NPM_PUBLISH_ENABLED is 'true'.
# Until then every push still runs gitleaks, check-public and a dry run.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Never publish what the package tests have not passed.
      - run: bun run test
      - name: Install gitleaks (pinned)
        run: |
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz
      - name: gitleaks (history)
        run: gitleaks git --config .gitleaks.toml --no-banner --redact --exit-code 1
      - run: bun scripts/check-public.ts --require-gitleaks
      - name: Publish
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          FORGEJO_GIT_TOKEN: ${{ secrets.FORGEJO_GIT_TOKEN }}
        run: bun scripts/release.ts
      - name: Dry run (publishing is off)
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: bun scripts/release.ts --dry-run
