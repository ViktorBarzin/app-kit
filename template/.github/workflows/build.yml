name: Build and Push

# Off-infra build (infra ADR-0002; default stack in ADR-0001). GitHub-hosted
# runners lint, test, build and push the image to GHCR. On master the image
# also gets `latest`, the repo gets its next vX.Y.Z tag (svu), and the build
# signals the Woodpecker deploy pipeline, which rolls Deployment `starter`.
#
# Committed on the FORGEJO side (the GitHub repo is a one-way mirror; commits
# made on GitHub are overwritten by the next sync).
#
# Per-app setup (infra scripts/offinfra-onboard --keep-workflows does it):
#   repo variable WOODPECKER_REPO_ID; secrets WOODPECKER_TOKEN,
#   FORGEJO_GIT_TOKEN, SLACK_WEBHOOK.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      # Database tests (and the HTTP tests against the built server) run when
      # TEST_DATABASE_URL is set; each test makes and drops its own database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      # The @viktorbarzin/* packages come from npm. Until they are published
      # (and app-kit's export has written bun.lock), the install below cannot
      # work; say that plainly instead of failing inside bun.
      - name: Check the @viktorbarzin packages resolve on npm
        run: |
          missing=""
          for spec in $(jq -r '(.dependencies // {}) + (.devDependencies // {})
              | to_entries[] | select(.key | startswith("@viktorbarzin/"))
              | "\(.key)@\(.value)"' package.json); do
            version=$(npm view "$spec" version 2>/dev/null | tail -n 1)
            if [ -z "$version" ]; then missing="$missing $spec"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=publish @viktorbarzin packages first::Not on npm:$missing. Publish them from viktor/app-kit (README, 'One-time npm setup'), then refresh this repo with app-kit's scripts/export-template.ts."
            exit 1
          fi
          if [ ! -f bun.lock ]; then
            echo "::error title=publish @viktorbarzin packages first::bun.lock is missing. Run app-kit's scripts/export-template.ts after the packages are on npm; it writes bun.lock."
            exit 1
          fi
          echo "all @viktorbarzin packages resolve on npm"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Build before typecheck and tests: vite writes src/routeTree.gen.ts, and
      # the HTTP tests start .output/server/index.mjs.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0      # full history + tags so svu sees the last vX.Y.Z
          fetch-tags: true
      # Auto-semver (svu): tag-only, pushed to CANONICAL Forgejo (GitHub tags
      # would be wiped by the next mirror sync). Best-effort: never blocks the build.
      - name: Compute + tag semver (svu)
        env:
          FORGEJO_GIT_TOKEN: ${{ secrets.FORGEJO_GIT_TOKEN }}
        run: |
          set +e
          git config user.email "ci@viktorbarzin.me"
          git config user.name "starter-ci"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl -sSL https://github.com/caarlos0/svu/releases/download/v3.4.1/svu_3.4.1_linux_amd64.tar.gz | tar -xz svu
          CUR=$(./svu current 2>/dev/null)
          NEXT=$(./svu next 2>/dev/null)
          echo "svu current=[$CUR] next=[$NEXT]"
          if [ -n "$NEXT" ] && [ "$NEXT" != "$CUR" ]; then
            git tag "$NEXT" 2>/dev/null
            git push "https://viktor:${FORGEJO_GIT_TOKEN}@forgejo.viktorbarzin.me/viktor/starter.git" "$NEXT" && echo "pushed tag $NEXT to forgejo" || echo "tag push failed (non-blocking)"
          fi
          exit 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          # Single-manifest images (no provenance/SBOM attestation children) so
          # registry retention can never orphan index children (ADR-0002).
          provenance: false
          tags: |
            ghcr.io/viktorbarzin/starter:${{ steps.meta.outputs.sha }}
            ghcr.io/viktorbarzin/starter:latest
          cache-from: type=gha,scope=starter
          cache-to: type=gha,mode=max,scope=starter
      # Keep the newest ~10 versions on ghcr (latest rides the newest one).
      - name: ghcr retention (keep 10)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: starter
          package-type: container
          min-versions-to-keep: 10
      # Signal Woodpecker (the GitHub mirror's registration) to run
      # .woodpecker/deploy.yml: kubectl set image in-cluster.
      - name: Trigger Woodpecker deploy
        run: |
          for attempt in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://ci.viktorbarzin.me/api/repos/${{ vars.WOODPECKER_REPO_ID }}/pipelines" \
              -H "Authorization: Bearer ${{ secrets.WOODPECKER_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"branch\":\"master\",\"variables\":{\"IMAGE_TAG\":\"${{ steps.meta.outputs.sha }}\"}}")
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "Woodpecker deploy triggered (HTTP $STATUS)"; exit 0
            fi
            echo "Attempt $attempt failed (HTTP $STATUS), retrying in 30s..."; sleep 30
          done
          echo "Failed to trigger Woodpecker deploy after 3 attempts"; exit 1

  notify-failure:
    needs: [lint-and-test, build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Slack notify
        run: |
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: starter build FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.SLACK_WEBHOOK }}" || true
